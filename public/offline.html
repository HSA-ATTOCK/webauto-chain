<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebAuto Chain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.4);
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 1.8rem;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline Mode</h1>
      <p>
        Your latest changes are stored locally. We will sync everything
        automatically once you reconnect.
      </p>
    </div>
  </body>
</html>
